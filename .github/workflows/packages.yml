# Builds the WhatsOps installers for every system, tests each one on its own system, and attaches them to the release.
# Runs by itself when a release is published; can be re-run by hand for an existing tag.
name: Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the installers to (empty = test run on this branch, nothing attached)
        required: false
        default: ''

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15-intel, platform: macos, arch: x64 }
          - { runner: macos-15, platform: macos, arch: arm64 }
          - { runner: windows-2022, platform: windows, arch: x64 }
          - { runner: ubuntu-22.04, platform: linux, arch: x64 }
          - { runner: ubuntu-22.04-arm, platform: linux, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Self-hosted check (no address of a real installation)
        run: node packaging/check-self-hosted.mjs
      - run: npm prune --omit=dev --no-audit --no-fund
      - name: rpmbuild (Linux)
        if: matrix.platform == 'linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q rpm
      - name: Build the installers, install and uninstall each one on this runner
        run: node packaging/build.mjs ${{ matrix.platform }} ${{ matrix.arch }}
        env:
          WHATSOPS_INSTALL_TEST: '1'
      - name: Attach to the release
        if: env.TAG != ''
        shell: bash
        run: gh release upload "$TAG" out/upload/* --clobber --repo "$GITHUB_REPOSITORY"
