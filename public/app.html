<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WhatsOps</title>
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<link rel="icon" href="/favicon.ico?v=2" sizes="any">
<link rel="apple-touch-icon" href="/favicon-192.png?v=2">
<link id="omTheme" rel="stylesheet" href="/theme.css?v=28">
<link rel="stylesheet" href="/static/base.css?v=28">
<link rel="stylesheet" href="/static/app.css?v=28">
<script src="/static/theme.js?v=28" defer></script>
<script src="/static/i18n.js?v=28"></script>
</head>
<body>
<header>
  <div class="brand"><img src="/favicon.svg?v=2" alt=""><div><b>WhatsOps</b><span id="host" class="muted"></span></div></div>
  <nav id="tabs">
    <button data-tab="numbers" class="on" data-i18n="nav.numbers"></button>
    <button data-tab="connect" data-i18n="nav.connect"></button>
    <button data-tab="settings" data-i18n="nav.settings"></button>
  </nav>
  <button id="logout" class="ghost small" data-i18n="logout"></button>
  <div class="subbar"><div class="subnav" data-for="connect" hidden><button data-sub="plugins" class="on" data-i18n="sub.plugins"></button><button data-sub="mcp">MCP</button><button data-sub="api">API</button><button data-sub="hooks" data-i18n="nav.hooks"></button></div><div class="subnav" data-for="settings" hidden><button data-sub="general" class="on" data-i18n="sub.general"></button><button data-sub="users" data-i18n="sub.users"></button><button data-sub="updates" data-i18n="sub.updates"></button><button data-sub="db" data-i18n="nav.db"></button><button data-sub="log" data-i18n="nav.log"></button><button data-sub="feedback" data-i18n="nav.feedback"></button><button data-sub="license" data-i18n="nav.license" hidden></button></div></div>
</header>
<main>
  <section id="numbers" class="tab on">
    <div class="head"><h2 data-i18n="numbers.title"></h2><div class="head-actions"><div class="viewsw" role="group" data-view-for="accounts"><button type="button" data-view="grid" data-i18n-title="view.grid"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="1" y="1" width="6" height="6"/><rect x="9" y="1" width="6" height="6"/><rect x="1" y="9" width="6" height="6"/><rect x="9" y="9" width="6" height="6"/></svg></button><button type="button" data-view="list" data-i18n-title="view.list"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="1" y="2" width="14" height="2.4"/><rect x="1" y="6.8" width="14" height="2.4"/><rect x="1" y="11.6" width="14" height="2.4"/></svg></button></div><button id="addNumber" data-i18n="numbers.add"></button></div></div>
    <div id="accounts" class="grid"></div>
  </section>

  <section id="connect" class="tab">
    <div class="sub on" id="connect-plugins">
      <div class="listbar" id="pluginBar"><div class="viewsw" role="group" data-view-for="pluginTiles"><button type="button" data-view="grid" data-i18n-title="view.grid"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="1" y="1" width="6" height="6"/><rect x="9" y="1" width="6" height="6"/><rect x="1" y="9" width="6" height="6"/><rect x="9" y="9" width="6" height="6"/></svg></button><button type="button" data-view="list" data-i18n-title="view.list"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="1" y="2" width="14" height="2.4"/><rect x="1" y="6.8" width="14" height="2.4"/><rect x="1" y="11.6" width="14" height="2.4"/></svg></button></div></div>
      <div class="tiles" id="pluginTiles"></div>
      <div id="pluginDetail" hidden></div>
    </div>
    <div class="sub" id="connect-mcp">
      <div class="listbar" id="mcpBar"><div class="viewsw" role="group" data-view-for="mcpTiles"><button type="button" data-view="grid" data-i18n-title="view.grid"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="1" y="1" width="6" height="6"/><rect x="9" y="1" width="6" height="6"/><rect x="1" y="9" width="6" height="6"/><rect x="9" y="9" width="6" height="6"/></svg></button><button type="button" data-view="list" data-i18n-title="view.list"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="1" y="2" width="14" height="2.4"/><rect x="1" y="6.8" width="14" height="2.4"/><rect x="1" y="11.6" width="14" height="2.4"/></svg></button></div></div>
      <div class="tiles" id="mcpTiles"></div>
      <div id="mcpDetail" hidden></div>
    </div>
    <div class="sub" id="connect-api">
    <p class="muted"><span data-i18n="api.base"></span> <code id="apiBase"></code> <button class="ghost small" data-copy-el="apiBase" data-i18n="copy"></button></p>
    <h3 data-i18n="keys.title"></h3>
    <p class="muted" data-i18n-html="keys.hint"></p>
    <form id="keyForm" class="card form">
      <label><span data-i18n="keys.name"></span> <input name="name" required data-i18n-ph="keys.namePh"></label>
      <div class="checks"><label><input type="checkbox" name="read" checked> <span data-i18n="keys.read"></span></label><label><input type="checkbox" name="send" checked> <span data-i18n="keys.send"></span></label><label><input type="checkbox" name="admin"> <span data-i18n="keys.admin"></span></label></div>
      <label><span data-i18n="keys.numbers"></span> <select name="accounts" multiple size="3"></select><span class="muted" data-i18n="keys.numbersHint"></span></label>
      <button type="submit" data-i18n="keys.create"></button>
    </form>
    <div id="newKey" class="card reveal" hidden></div>
    <div id="keyList"></div>
    <div class="head vhead"><h3 data-i18n="api.vocab"></h3><span><span id="apiCount" class="muted small"></span> <a href="/docs" target="_blank" rel="noopener" class="small" data-i18n="api.full"></a></span></div>
    <input id="apiFilter" type="search" data-i18n-ph="api.filter">
    <div id="apiVocab" class="grid two vocab"></div>
    </div>
    <div class="sub" id="connect-hooks">
    <p class="muted"><span data-i18n="hooks.hint"></span> <code>X-WA-Signature: sha256=HMAC(secret, X-WA-Timestamp + "." + body)</code></p>
    <form id="hookForm" class="card form">
      <label><span data-i18n="hooks.url"></span> <input name="url" type="url" required placeholder="https://n8n.example.com/webhook/…"></label>
      <div class="row"><label><span data-i18n="hooks.events"></span> <input name="events" value="message.received"></label><label><span data-i18n="hooks.number"></span> <select name="account"></select></label></div>
      <span class="muted" data-i18n="hooks.eventsHint"></span>
      <button type="submit" data-i18n="hooks.add"></button>
    </form>
    <div id="newHook" class="card reveal" hidden></div>
    <div id="hookList"></div>
    <h3 data-i18n="hooks.deliveries"></h3>
    <div id="deliveries"></div>
    </div>
  </section>

  <section id="settings" class="tab">
    <div class="sub on" id="settings-general">
    <div class="card form" id="appearCard">
      <h3 data-i18n="appear.title"></h3>
      <div class="seg" role="radiogroup">
        <label><input type="radio" name="appearance" value="light"><span data-i18n="appear.light"></span></label>
        <label><input type="radio" name="appearance" value="dark"><span data-i18n="appear.dark"></span></label>
        <label><input type="radio" name="appearance" value="system"><span data-i18n="appear.system"></span></label>
      </div>
      <p class="muted small" id="appearInfo"></p>
    </div>
    <form id="setForm" class="card form">
      <div class="row"><label><span data-i18n="set.rate"></span> <input name="ratePerMin" type="number" min="1"></label><label><span data-i18n="set.gap"></span> <input name="perChatGapMs" type="number" min="0"></label></div>
      <label><span data-i18n="set.allow"></span> <input name="sendAllowlist" data-i18n-ph="set.allowPh"></label>
      <label class="inline"><input type="checkbox" name="allowColdContacts"> <span data-i18n="set.cold"></span></label>
      <label class="inline"><input type="checkbox" name="otpEnabled"> <span data-i18n="set.otp"></span></label>
      <div class="row"><label><span data-i18n="set.ttl"></span> <input name="oauthAccessTtl" type="number" min="300"></label><label><span data-i18n="set.refresh"></span> <input name="oauthRefreshDays" type="number" min="1"></label></div>
      <div class="row"><label><span data-i18n="set.publicUrl"></span> <input name="publicUrl" placeholder="https://whatsops.example.com"></label><label class="narrow"><span data-i18n="set.maxMedia"></span> <input name="maxMediaMb" type="number" min="1"></label></div>
      <button type="submit" data-i18n="save"></button>
    </form>
    <form id="pwForm" class="card form">
      <h3 data-i18n="pw.title"></h3>
      <p class="muted" id="pwState"></p>
      <label><span data-i18n="pw.new"></span> <input name="password" type="password" minlength="10" autocomplete="new-password"></label>
      <div class="row"><button type="submit" data-i18n="pw.save"></button><button type="button" id="pwClear" class="ghost" data-i18n="pw.clear"></button></div>
    </form>
    <div class="card form"><h3 data-i18n="link.title"></h3><p class="muted" data-i18n="link.hint"></p><button id="mkLink" class="ghost" data-i18n="link.make"></button><div id="linkOut" class="reveal" hidden></div>
    <h3 data-i18n="svc.title"></h3><p class="muted" id="svcInfo"></p><button id="restart" class="ghost" data-i18n="svc.restart"></button></div>
    <div class="card"><h3 data-i18n="connect.sessions"></h3><div id="sessions"></div></div>
    </div>
    <div class="sub" id="settings-users">
      <div class="card">
        <h3 data-i18n="users.title"></h3>
        <p class="muted small" data-i18n="users.hint"></p>
        <div id="userList"></div>
      </div>
      <form class="card form" id="userAdd">
        <h3 data-i18n="users.add"></h3>
        <div class="row"><label><span data-i18n="users.name"></span> <input name="name" required maxlength="120"></label><label><span data-i18n="users.phone"></span> <input name="phone" type="tel" placeholder="+39 333 123 4567"></label></div>
        <div><span class="muted small" data-i18n="users.plugins"></span><div id="userAddPlugins" class="user-plugins"></div></div>
        <p class="muted small" data-i18n="users.addHint"></p>
        <button type="submit" data-i18n="users.addBtn"></button>
      </form>
    </div>
    <div class="sub" id="settings-log">
      <div class="term live" id="term">
        <div class="term-bar">
          <span class="term-title">whatsops@<span id="termHost"></span>:~$ tail -f whatsops.log</span>
          <select id="logLevel"><option value="all" data-i18n="log.all"></option><option value="info" data-i18n="log.info"></option><option value="warn" data-i18n="log.warn"></option><option value="error" data-i18n="log.error"></option></select>
          <input id="logQ" type="search" data-i18n-ph="log.search" spellcheck="false">
          <button type="button" id="logLive" class="term-btn on"><span class="dot">●</span> <span data-i18n="log.live"></span></button>
          <button type="button" id="logClear" class="term-btn" data-i18n="log.clear"></button>
          <a id="logDl" class="term-btn" href="/v1/admin/logs/download" data-i18n="log.download"></a>
        </div>
        <div id="logList" class="term-body" tabindex="0"></div>
        <div class="term-status"><span id="logCount"></span><button type="button" id="logJump" hidden></button></div>
      </div>
    </div>
    <div class="sub" id="settings-updates">
      <div class="card form">
        <h3 data-i18n="upd.title"></h3>
        <p><span class="muted" data-i18n="upd.current"></span> <b id="updCur"></b></p>
        <p><span class="muted" data-i18n="upd.latest"></span> <b id="updLatest"></b></p>
        <p id="updState"></p>
        <label class="inline"><input type="checkbox" id="updAuto"> <span data-i18n="upd.auto"></span></label>
        <p class="muted small" id="updHint"></p>
        <div class="row"><button type="button" id="updCheck" class="ghost" data-i18n="upd.check"></button><button type="button" id="updApply" data-i18n="upd.apply" hidden></button></div>
        <div id="updNotes" hidden><h3 data-i18n="upd.notes"></h3><pre id="updNotesText"></pre></div>
      </div>
    </div>
    <div class="sub" id="settings-feedback">
      <form id="fbForm" class="card form">
        <h3 data-i18n="fb.title"></h3>
        <p class="muted small" id="fbHint"></p>
        <div class="seg" role="radiogroup">
          <label><input type="radio" name="kind" value="bug" checked><span data-i18n="fb.bug"></span></label>
          <label><input type="radio" name="kind" value="idea"><span data-i18n="fb.idea"></span></label>
          <label><input type="radio" name="kind" value="other"><span data-i18n="fb.other"></span></label>
        </div>
        <label><span data-i18n="fb.subject"></span> <input name="title" minlength="3" maxlength="120" required></label>
        <label><span data-i18n="fb.message"></span> <textarea name="message" rows="6" minlength="5" maxlength="8000" required></textarea></label>
        <label class="inline"><input type="checkbox" name="diagnostics" checked> <span data-i18n="fb.diag"></span></label>
        <button type="submit" data-i18n="fb.send"></button>
      </form>
      <div class="card form">
        <h3 data-i18n="rep.title"></h3>
        <p class="muted small" data-i18n="rep.hint"></p>
        <div class="seg" role="radiogroup">
          <label><input type="radio" name="crashReports" value="ask"><span data-i18n="rep.ask"></span></label>
          <label><input type="radio" name="crashReports" value="auto"><span data-i18n="rep.auto"></span></label>
          <label><input type="radio" name="crashReports" value="off"><span data-i18n="rep.off"></span></label>
        </div>
        <div id="repList"></div>
      </div>
      <div class="card">
        <h3 data-i18n="fb.sent"></h3>
        <div id="fbSent"></div>
        <p class="muted small"><span data-i18n="fb.install"></span> <code id="fbCode"></code></p>
      </div>
    </div>
    <div class="sub" id="settings-license">
      <form id="licForm" class="card form">
        <h3 data-i18n="lic.title"></h3>
        <p id="licState"></p>
        <label><span data-i18n="lic.key"></span> <input name="key" autocomplete="off" spellcheck="false"></label>
        <div class="row"><button type="submit" data-i18n="lic.activate"></button><button type="button" class="ghost danger" id="licRemove" data-i18n="lic.remove"></button></div>
      </form>
    </div>
    <div class="sub" id="settings-db">
    <div class="card"><div id="dbCurrent"></div></div>
    <form id="dbForm" class="card form">
      <h3 data-i18n="db.move"></h3>
      <label><span data-i18n="db.type"></span> <select name="type"><option value="sqlite" data-i18n="db.sqlite"></option><option value="postgres">PostgreSQL</option><option value="mysql">MySQL / MariaDB</option></select></label>
      <div data-for="sqlite"><label><span data-i18n="db.path"></span> <input name="path"></label></div>
      <div data-for="net" hidden>
        <div class="row"><label><span data-i18n="db.host"></span> <input name="host" placeholder="127.0.0.1"></label><label class="narrow"><span data-i18n="db.port"></span> <input name="port" placeholder="5432"></label></div>
        <div class="row"><label><span data-i18n="db.database"></span> <input name="database" placeholder="whatsapp"></label><label><span data-i18n="db.user"></span> <input name="user"></label></div>
        <label><span data-i18n="db.password"></span> <input name="password" type="password" autocomplete="new-password"></label>
        <label class="inline"><input type="checkbox" name="ssl"> <span data-i18n="db.ssl"></span></label>
      </div>
      <label><span data-i18n="db.url"></span> <input name="url" placeholder="postgres://user:pass@host:5432/db"></label>
      <label class="inline"><input type="checkbox" name="copy" checked> <span data-i18n="db.copy"></span></label>
      <div class="row"><button type="button" id="dbTest" class="ghost" data-i18n="db.test"></button><button type="submit" data-i18n="db.switch"></button></div>
      <div id="dbResult" class="muted"></div>
    </form>
    </div>
  </section>

</main>

<dialog id="pairDlg">
  <form method="dialog" class="dlg">
    <h3 id="pairTitle"></h3>
    <div id="pairChoose">
      <p class="muted" data-i18n-html="pair.choose"></p>
      <div class="row"><button type="button" id="pairQr" data-i18n="pair.qr"></button><button type="button" id="pairCodeBtn" class="ghost" data-i18n="pair.code"></button></div>
      <div id="pairPhoneBox" hidden><label><span data-i18n="pair.phone"></span> <input id="pairPhone" placeholder="+971501234567"></label><button type="button" id="pairCodeGo" data-i18n="pair.codeGo"></button></div>
    </div>
    <div id="pairShow" hidden>
      <img id="pairImg" alt="QR" hidden>
      <div id="pairCode" class="bigcode" hidden></div>
      <p id="pairHelp" class="muted"></p>
      <p id="pairState" class="state"></p>
    </div>
    <div class="row"><button value="close" class="ghost" data-i18n="close"></button></div>
  </form>
</dialog>

<dialog id="addDlg">
  <form method="dialog" class="dlg" id="addForm">
    <h3 data-i18n="add.title"></h3>
    <p class="muted small" data-i18n="add.nameHint"></p>
    <label><span data-i18n="add.phone"></span> <input name="phone" placeholder="+971501234567"></label>
    <label class="inline"><input type="checkbox" name="sync" checked> <span data-i18n="add.sync"></span></label>
    <div class="row"><button value="cancel" class="ghost" formnovalidate data-i18n="cancel"></button><button value="ok" id="addGo" data-i18n="add.go"></button></div>
  </form>
</dialog>

<dialog id="importDlg">
  <form method="dialog" class="dlg" id="importForm">
    <h3 data-i18n="import.title"></h3>
    <p class="muted" data-i18n="import.hint"></p>
    <label><span data-i18n="import.session"></span> <input name="sessionDir" placeholder="~/.hermes/whatsapp/session"></label>
    <label><span data-i18n="import.history"></span> <input name="historyDb" placeholder="~/.hermes/whatsapp/history.db"></label>
    <div class="row"><button value="cancel" class="ghost" formnovalidate data-i18n="cancel"></button><button value="ok" data-i18n="import.go"></button></div>
  </form>
</dialog>

<dialog id="profDlg">
  <form method="dialog" class="dlg" id="profForm">
    <h3 data-i18n="prof.title"></h3>
    <div class="prof-head"><span class="avatar big" id="profAvatar"></span><div><div class="phone" id="profPhone"></div><p class="muted small" data-i18n="prof.hint"></p></div></div>
    <label><span data-i18n="prof.name"></span> <input name="name" maxlength="25" required></label>
    <label><span data-i18n="prof.about"></span> <textarea name="about" rows="2" maxlength="139"></textarea></label>
    <label><span data-i18n="prof.photo"></span> <input name="photo" type="file" accept="image/*"></label>
    <div class="row"><button type="button" class="ghost small danger" id="profRemovePhoto" data-i18n="prof.removePhoto"></button></div>
    <div class="row"><button value="cancel" class="ghost" formnovalidate data-i18n="cancel"></button><button value="ok" data-i18n="save"></button></div>
  </form>
</dialog>

<div id="toast"></div>
<script src="/static/app.js?v=28"></script>
</body>
</html>
